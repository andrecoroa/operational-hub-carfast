<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="980" fill="#F3F6FA"/>
  <style>
    .label{font:700 14px Arial,sans-serif;fill:#A64B39}
    .h1{font:800 34px Arial,sans-serif;fill:#071124}
    .h2{font:800 23px Arial,sans-serif;fill:#071124}
    .h3{font:800 18px Arial,sans-serif;fill:#071124}
    .txt{font:400 17px Arial,sans-serif;fill:#667085}
    .small{font:400 14px Arial,sans-serif;fill:#667085}
    .bold{font:800 16px Arial,sans-serif;fill:#071124}
    .th{font:800 14px Arial,sans-serif;fill:#667085}
    .td{font:400 15px Arial,sans-serif;fill:#071124}
    .muted{font:400 15px Arial,sans-serif;fill:#667085}
    .card{fill:white;stroke:#DDE3EA;stroke-width:1}
    .pill{fill:#F9EDEB}
    .ok{fill:#E9F7EF}
    .warn{fill:#FFF5D6}
    .blue{fill:#EEF4FF}
    .line{stroke:#E1E7EF;stroke-width:1}
