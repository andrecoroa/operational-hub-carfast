{% extends "base.html" %}
{% block body %}
<div class="app-shell">
  <aside class="sidebar">
    <div>
      <p class="eyebrow">CarFast</p>
      <h1>Gestão de Tarefas</h1>
    </div>
    <nav>
      <a href="/">Dashboard</a>
      <div class="nav-group">
        <a href="/task-board" class="active nav-parent">Centro de Tarefas</a>
        <div class="nav-subnav">
          <a href="/task-board/new" class="active">Criação</a>
          <a href="/task-board">Gestão</a>
        </div>
      </div>
      <a href="/workshop">Oficina</a>
      <a href="/fleet">Frota</a>
      <a href="/imports">Importações</a>
      <a href="/admin">Administração</a>
    </nav>
  </aside>
  <main class="content">
    <header class="topbar">
      <div>
        <p class="eyebrow">Criação operacional</p>
        <h2>Nova tarefa</h2>
      </div>
      <div class="button-row">
        <a class="button-link secondary-link" href="/task-board">Gestão</a>
      </div>
    </header>

    {% if error %}
      <div class="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/task-board/new" class="form-panel form-stack task-form task-create-page">
      <div class="panel-heading">
        <p class="eyebrow">Novo registo</p>
        <h3>Dados essenciais</h3>
      </div>
      <label>
        Assunto
        <input type="text" name="title" maxlength="200" required>
      </label>
      <div class="form-grid">
        <label>
          Natureza
          <select name="task_type">
            {% for code, label in task_types %}
              <option value="{{ code }}">{{ label }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Origem
          <select name="source">
            {% for code, label in task_sources %}
              <option value="{{ code }}">{{ label }}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <div class="form-grid">
        <label>
          Categoria
          <select name="category">
            {% for code, label in task_categories %}
              <option value="{{ code }}">{{ label }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Classificação
          <input type="text" name="subcategory" maxlength="120">
        </label>
      </div>
      <div class="form-grid">
        <label>
          Prioridade
          <select name="priority">
            {% for code, label in priorities %}
              <option value="{{ code }}">{{ label }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Data limite
          <input type="date" name="due_on">
        </label>
      </div>
      <div class="form-grid">
        <label>
          Responsável
          <select name="assigned_to_id">
            <option value="">Sem responsável</option>
            {% for user in users %}
              <option value="{{ user.id }}">{{ user.name }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Equipa/Fila
          <select name="team_id">
            <option value="">Sem equipa</option>
            {% for team in teams %}
              <option value="{{ team.id }}" {% if team.code == "operations" %}selected{% endif %}>{{ team.name }}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <div class="form-grid">
        <label>
          Cliente
          <input type="text" name="customer_name" maxlength="200">
        </label>
        <label>
          Contacto
          <input type="text" name="customer_contact" maxlength="200">
        </label>
      </div>
      <div class="form-grid">
        <label>
          E-mail
          <input type="email" name="customer_email" maxlength="255">
        </label>
        <label>
          Telefone
          <input type="text" name="customer_phone" maxlength="80">
        </label>
      </div>
      <div class="form-grid">
        <label>
          Matrícula
          <input type="text" name="plate" maxlength="40">
        </label>
        <label>
          Reserva
          <input type="text" name="reservation_number" maxlength="120">
        </label>
      </div>
      <div class="form-grid">
        <label>
          Contrato
          <input type="text" name="contract_number" maxlength="120">
        </label>
        <label>
          Estação
          <input type="text" name="station" maxlength="120">
        </label>
      </div>
      <label>
        Departamento/Fila
        <input type="text" name="department" maxlength="120">
      </label>
      <label>
        ID externo
        <input type="text" name="external_source_id" maxlength="255">
      </label>
      <label>
        Descrição
        <textarea name="description" rows="5"></textarea>
      </label>
      <button type="submit">Criar tarefa</button>
    </form>
  </main>
</div>
{% endblock %}
