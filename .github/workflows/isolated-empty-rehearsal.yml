name: Isolated empty rehearsal

on:
  workflow_dispatch:
  push:
    branches:
      - codex/isolated-empty-rehearsal
      - codex/anonymized-streaming-rehearsal
      - codex/integral-migration-rehearsal

permissions:
  contents: read

concurrency:
  group: isolated-empty-rehearsal-v2
  cancel-in-progress: true

jobs:
  empty-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      APP_SECRET_KEY: ephemeral-ci-only
      DATABASE_URL: postgresql+psycopg://carfast:carfast@rehearsal-postgres:5432/carfast_rehearsal_test
      DOCUMENT_ARCHIVE_ROOT: /tmp/carfast-rehearsal/documents
      DOCUMENT_INVOICE_INBOX_PATH: /tmp/carfast-rehearsal/inbox
      EMAIL_STORAGE_ROOT: /tmp/carfast-rehearsal/email
      EMAIL_INBOUND_ENABLED: "false"
      EMAIL_OUTBOUND_ENABLED: "false"
      WEBHOOKS_ENABLED: "false"
      SCHEDULED_JOBS_ENABLED: "false"
      PORTALS_ENABLED: "false"
      EXTERNAL_INTEGRATIONS_ENABLED: "false"
      DOCUMENT_FIXTURES_ONLY: "true"
      REAL_DATA_ALLOWED: "false"
      POSTMARK_SERVER_TOKEN: ""
      INTEGRATION_API_KEY: ""
      WEBHOOK_SIGNING_SECRET: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install and build before network isolation
        run: |
          python -m pip install -r requirements-dev.txt
          docker pull postgres:17-bookworm
          docker build -f .github/rehearsal.Dockerfile -t carfast-empty-rehearsal .
      - name: Verify fail-closed configuration
        run: |
          sh -n scripts/run_integral_e2e_rehearsal.sh
          sh -n scripts/run_integral_render_rehearsal.sh
          python -m scripts.validate_isolated_environment
          python -m pytest -q tests/test_isolated_environment.py tests/test_phase10_rehearsal.py \
            tests/test_integral_reconciliation.py tests/test_integral_storage_stream.py \
            tests/test_integral_transfer.py tests/test_integral_migration_contract.py
          python -m pytest -q tests/test_preflight_integral_runtime.py \
            tests/test_encrypted_spool.py tests/test_integral_tcp.py \
            tests/test_integral_bundle_tcp.py
          python -m pytest -q tests/test_capture_authorization.py \
            tests/test_anonymized_stream.py tests/test_anonymized_receive.py \
            tests/test_render_empty_rehearsal_guard.py \
            tests/test_post_anonymized_pilot.py
          python -m scripts.prepare_anonymized_stream \
            --fixture tests/fixtures/anonymization_input.jsonl >/tmp/anonymized-fixture.jsonl
          test "$(wc -l </tmp/anonymized-fixture.jsonl)" -eq 8
          rm -f /tmp/anonymized-fixture.jsonl
          docker run --rm --network none \
            -e REAL_DATA_ALLOWED=false -e EXTERNAL_INTEGRATIONS_ENABLED=false \
            carfast-empty-rehearsal \
              python -m scripts.prepare_anonymized_stream \
                --fixture tests/fixtures/anonymization_input.jsonl \
          | python -c "import sys; from app.platform.anonymized_receive import validated_envelopes; assert len(list(validated_envelopes(sys.stdin.buffer))) == 8"
      - name: Create internal-only application network
        run: |
          docker network create --internal carfast-rehearsal-internal
          docker run -d --rm \
            --name rehearsal-postgres \
            --network carfast-rehearsal-internal \
            -e POSTGRES_DB=carfast_rehearsal_test \
            -e POSTGRES_USER=carfast \
            -e POSTGRES_PASSWORD=carfast \
            postgres:17-bookworm
          for attempt in $(seq 1 30); do
            if docker exec rehearsal-postgres pg_isready -U carfast -d carfast_rehearsal_test; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Prove egress denial, bootstrap and reconcile
        run: |
          if docker run --rm --network carfast-rehearsal-internal carfast-empty-rehearsal \
            python -c "import urllib.request; urllib.request.urlopen('https://carfast-stock.onrender.com', timeout=5)"; then
            echo "Outbound production endpoint unexpectedly reachable"
            exit 1
          else
            echo "Outbound network denied inside the application network as required"
          fi
          docker run --rm --network carfast-rehearsal-internal \
            -e APP_ENV -e APP_SECRET_KEY -e DATABASE_URL \
            -e DOCUMENT_ARCHIVE_ROOT -e DOCUMENT_INVOICE_INBOX_PATH -e EMAIL_STORAGE_ROOT \
            -e EMAIL_INBOUND_ENABLED -e EMAIL_OUTBOUND_ENABLED -e WEBHOOKS_ENABLED \
            -e SCHEDULED_JOBS_ENABLED -e PORTALS_ENABLED -e EXTERNAL_INTEGRATIONS_ENABLED \
            -e DOCUMENT_FIXTURES_ONLY -e REAL_DATA_ALLOWED -e POSTMARK_SERVER_TOKEN \
            -e INTEGRATION_API_KEY -e WEBHOOK_SIGNING_SECRET \
            -e GITHUB_SHA \
            carfast-empty-rehearsal sh -ec '
              python -m scripts.validate_isolated_environment
              python -m alembic upgrade head
              python -m scripts.bootstrap_installation
              python -m scripts.check_clean_install
              python -m scripts.run_phase10_rehearsal
              python -m pytest -q tests/test_modular_foundation.py tests/test_legacy_consolidation.py
            '

      - name: Rehearse integral PostgreSQL and storage copy with synthetic data
        run: |
          docker run -d --rm --name carfast-integral-fixture \
            --network carfast-rehearsal-internal \
            -e APP_ENV -e APP_SECRET_KEY -e DATABASE_URL -e GITHUB_SHA \
            carfast-empty-rehearsal sleep infinity
          docker run --rm --network carfast-rehearsal-internal \
            -e PGPASSWORD=carfast postgres:17-bookworm sh -ec '
              createdb -h rehearsal-postgres -U carfast carfast_integral_source_test
              createdb -h rehearsal-postgres -U carfast carfast_integral_staging_test
              createdb -h rehearsal-postgres -U carfast carfast_integral_target_test
            '
          docker exec \
            -e DATABASE_URL=postgresql+psycopg://carfast:carfast@rehearsal-postgres:5432/carfast_integral_source_test \
            carfast-integral-fixture sh -ec '
              python -m alembic upgrade ffae1f2a3b4c
              python -m scripts.validate_integral_migration_contract source
            '
          docker run --rm --network carfast-rehearsal-internal \
            -e PGPASSWORD=carfast postgres:17-bookworm psql \
              -h rehearsal-postgres -U carfast -d carfast_integral_source_test \
              -v ON_ERROR_STOP=1 -c \
              "INSERT INTO permissions (id, code, name, description) VALUES (999999, 'integral.fixture', 'Integral fixture', NULL)"
          docker run --rm --network carfast-rehearsal-internal \
            -e PGPASSWORD=carfast postgres:17-bookworm psql \
              -h rehearsal-postgres -U carfast -d carfast_integral_source_test \
              -v ON_ERROR_STOP=1 -c \
              "CREATE ROLE integral_source_ro LOGIN PASSWORD 'fixture-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS; GRANT CONNECT ON DATABASE carfast_integral_source_test TO integral_source_ro; GRANT USAGE ON SCHEMA public TO integral_source_ro; GRANT SELECT ON ALL TABLES IN SCHEMA public TO integral_source_ro; REVOKE ALL ON ALL SEQUENCES IN SCHEMA public FROM integral_source_ro"
          docker exec \
            -e DATABASE_URL=postgresql+psycopg://integral_source_ro:fixture-only@rehearsal-postgres:5432/carfast_integral_source_test \
            -e INTEGRAL_EXPECTED_DATABASE_ROLE=integral_source_ro \
            carfast-integral-fixture sh -ec '
            mkdir -p /tmp/integral/source-storage
            printf synthetic-integral-fixture >/tmp/integral/source-storage/object.bin
            python -m scripts.build_integral_reconciliation_manifest \
              --output /tmp/integral/source.json \
              --storage-root /tmp/integral/source-storage \
              --release-sha 58a150c701221b64c43bd14fcb671683f3722ebe \
              --database-label source --inventory-phase source --validate-source-role
          '
          docker run --rm --network carfast-rehearsal-internal \
            -e PGPASSWORD=fixture-only postgres:17-bookworm sh -ec '
              pg_dump -Fc --no-owner --no-privileges --exclude-table-data="*seq" \
                -h rehearsal-postgres -U integral_source_ro carfast_integral_source_test \
              | PGPASSWORD=carfast pg_restore --exit-on-error --single-transaction --no-owner --no-privileges \
                  -h rehearsal-postgres -U carfast -d carfast_integral_staging_test
            '
          docker exec carfast-integral-fixture sh -ec '
            python -m scripts.export_integral_storage --root /tmp/integral/source-storage \
            | python -m scripts.import_integral_storage \
                --staging-root /tmp/integral/target-storage
          '
          docker exec \
            -e DATABASE_URL=postgresql+psycopg://carfast:carfast@rehearsal-postgres:5432/carfast_integral_staging_test \
            carfast-integral-fixture sh -ec '
              python -m scripts.build_integral_reconciliation_manifest \
                --output /tmp/integral/staging.json \
                --storage-root /tmp/integral/target-storage \
                --release-sha 58a150c701221b64c43bd14fcb671683f3722ebe \
                --database-label target --inventory-phase staging
              python -m scripts.compare_integral_reconciliation_manifests \
                /tmp/integral/source.json /tmp/integral/staging.json
              python -m alembic upgrade fff37f8a9b0d
              python -m scripts.validate_integral_migration_contract target
              python -m scripts.build_integral_reconciliation_manifest \
                --output /tmp/integral/migrated.json \
                --storage-root /tmp/integral/target-storage \
                --release-sha "$GITHUB_SHA" --database-label target --inventory-phase target
              python -m scripts.compare_integral_migration_manifests \
                /tmp/integral/source.json /tmp/integral/migrated.json
            '
          docker exec \
            -e DATABASE_URL=postgresql+psycopg://carfast:carfast@rehearsal-postgres:5432/carfast_integral_target_test \
            carfast-integral-fixture python -m alembic upgrade fff37f8a9b0d
          TABLES="$(docker run --rm --network carfast-rehearsal-internal \
            -e PGPASSWORD=carfast postgres:17-bookworm psql \
              -h rehearsal-postgres -U carfast -d carfast_integral_target_test -Atqc \
              "SELECT string_agg(format('%I', tablename), ', ' ORDER BY tablename) FROM pg_tables WHERE schemaname='public' AND tablename<>'alembic_version'")"
          docker run --rm --network carfast-rehearsal-internal \
            -e PGPASSWORD=carfast postgres:17-bookworm psql \
              -h rehearsal-postgres -U carfast -d carfast_integral_target_test \
              -v ON_ERROR_STOP=1 -c "TRUNCATE TABLE $TABLES RESTART IDENTITY CASCADE"
          docker run --rm --network carfast-rehearsal-internal \
            -e PGPASSWORD=carfast postgres:17-bookworm sh -ec '
              pg_dump -Fc --data-only --exclude-table-data=alembic_version \
                --exclude-table-data="*seq" -h rehearsal-postgres -U carfast \
                carfast_integral_staging_test \
              | pg_restore --data-only --exit-on-error --single-transaction \
                  --no-owner --no-privileges -h rehearsal-postgres -U carfast \
                  -d carfast_integral_target_test
            '
          docker exec \
            -e DATABASE_URL=postgresql+psycopg://carfast:carfast@rehearsal-postgres:5432/carfast_integral_target_test \
            carfast-integral-fixture sh -ec '
              python -m scripts.validate_integral_migration_contract target
              python -m scripts.build_integral_reconciliation_manifest \
                --output /tmp/integral/target.json \
                --storage-root /tmp/integral/target-storage \
                --release-sha "$GITHUB_SHA" --database-label target --inventory-phase target
              python -m scripts.compare_integral_reconciliation_manifests \
                /tmp/integral/migrated.json /tmp/integral/target.json
            '
      - name: Prove three consecutive end-to-end TCP bundle rehearsals
        run: |
          docker exec -e GITHUB_SHA carfast-integral-fixture \
            sh scripts/run_integral_e2e_rehearsal.sh 1 16777216
          docker exec -e GITHUB_SHA carfast-integral-fixture \
            sh scripts/run_integral_e2e_rehearsal.sh 2 16777216
          docker exec -e GITHUB_SHA carfast-integral-fixture \
            sh scripts/run_integral_e2e_rehearsal.sh 3 1256277934
      - name: Destroy isolated resources
        if: always()
        run: |
          docker rm -f rehearsal-postgres 2>/dev/null || true
          docker rm -f carfast-integral-fixture 2>/dev/null || true
          docker network rm carfast-rehearsal-internal 2>/dev/null || true

      - name: Build local-socket PostgreSQL destination image
        run: docker build -f deploy/rehearsal/Dockerfile -t carfast-anonymized-destination .

      - name: Validate PostgreSQL uses only its Unix socket
        run: |
          docker volume create carfast-anonymized-fixture
          docker run -d --name carfast-anonymized-destination \
            -v carfast-anonymized-fixture:/var/data \
            -e APP_ENV=test -e APP_SECRET_KEY=fixture-only \
            -e REAL_DATA_ALLOWED=false -e DOCUMENT_FIXTURES_ONLY=true \
            -e EXTERNAL_INTEGRATIONS_ENABLED=false \
            carfast-anonymized-destination
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' carfast-anonymized-destination)" != true ]; then
              docker logs carfast-anonymized-destination
              exit 1
            fi
            if docker exec carfast-anonymized-destination \
              sh -ec '[ -z "$(psql -U postgres -h /var/run/postgresql -d carfast_anonymized_test \
                -Atc "SHOW listen_addresses")" ] && \
                [ "$(psql -U postgres -h /var/run/postgresql -d carfast_anonymized_test \
                -Atc "SHOW unix_socket_directories")" = /var/run/postgresql ]'; then
              exit 0
            fi
            sleep 2
          done
          docker logs carfast-anonymized-destination
          exit 1

      - name: Stream fixtures into typed relational staging
        run: |
          python -m scripts.prepare_anonymized_stream \
            --fixture tests/fixtures/anonymization_input.jsonl \
          | docker exec -i carfast-anonymized-destination \
              /opt/carfast-venv/bin/python -m scripts.receive_anonymized_stream \
                --dsn 'postgresql://postgres@/carfast_anonymized_test?host=/var/run/postgresql'
          test "$(docker exec carfast-anonymized-destination \
            psql -U postgres -h /var/run/postgresql -d carfast_anonymized_test \
              -Atc 'SELECT COUNT(*) FROM rehearsal_documents d JOIN rehearsal_tasks t ON t.id=d.task_id JOIN rehearsal_vehicles v ON v.id=d.vehicle_id')" -eq 1
          if printf '%s\n' '{"schema":2,"pilot":"eight-table","table":"users","data":{"id":1,"active":true}}' \
            | docker exec -i carfast-anonymized-destination \
                /opt/carfast-venv/bin/python -m scripts.receive_anonymized_stream \
                  --dsn 'postgresql://postgres@/carfast_anonymized_test?host=/var/run/postgresql'; then
            echo "Adversarial raw ID was unexpectedly accepted"
            exit 1
          fi
          test "$(docker exec carfast-anonymized-destination \
            psql -U postgres -h /var/run/postgresql -d carfast_anonymized_test \
              -Atc 'SELECT COUNT(*) FROM rehearsal_documents')" -eq 1

      - name: Destroy local-socket fixture destination
        if: always()
        run: |
          docker rm -f carfast-anonymized-destination 2>/dev/null || true
          docker volume rm carfast-anonymized-fixture 2>/dev/null || true
