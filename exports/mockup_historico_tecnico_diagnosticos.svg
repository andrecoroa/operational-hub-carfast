  <line x1="70" y1="892" x2="1530" y2="892" class="line"/>

  <rect x="40" y="940" width="1520" height="1" fill="#DDE3EA"/>
  <text x="70" y="964" class="small">Ao clicar numa coluna, abre o relatório/documento original e o detalhe completo da leitura.</text>
