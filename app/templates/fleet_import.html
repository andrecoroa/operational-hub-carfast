{% extends "base.html" %}
{% block body %}
<div class="app-shell">
  <aside class="sidebar">
    <div>
      <p class="eyebrow">CarFast</p>
      <h1>Importações</h1>
    </div>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/task-board">Centro de Tarefas</a>
      <a href="/workshop">Oficina</a>
      <a href="/fleet">Frota</a>
      <a href="/imports">Importações</a>
      <a href="/documents">Documentos</a>
      <a href="/admin">Administração</a>
    </nav>
  </aside>
  <main class="content">
    <header class="topbar">
      <div>
        <p class="eyebrow">Rentway</p>
        <h2>Importar frota</h2>
      </div>
      <a class="button-link secondary-link" href="/imports">Histórico</a>
    </header>

    <section class="form-panel">
      {% if error %}
        <div class="alert">{{ error }}</div>
      {% endif %}
      <form method="post" action="/imports/fleet" enctype="multipart/form-data" class="form-stack">
        <label>
          Ficheiro XLSX
          <input type="file" name="file" accept=".xlsx" required>
        </label>
        <button type="submit">Importar</button>
      </form>
    </section>
  </main>
</div>
{% endblock %}
