  <text x="40" y="42" class="label">VIATURA PERMANENTE</text>
  <text x="40" y="82" class="h1">BC-10-EB</text>
  <text x="40" y="116" class="txt">Histórico técnico / Diagnósticos</text>
  <rect x="1290" y="28" width="120" height="46" rx="8" class="card"/>
  <text x="1322" y="57" class="bold" fill="#A64B39">Exportar</text>
