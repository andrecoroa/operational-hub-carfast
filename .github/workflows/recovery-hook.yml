name: Recovery hook gate

on:
  push:
    branches:
      - codex/blue-migration-recovery-hook
  pull_request:

jobs:
  recovery-hook:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RECOVERY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint recovery path
        run: python -m ruff check scripts/migration_window_recovery.py tests/test_migration_window_recovery.py
      - name: Compile startup path
        run: python -m py_compile scripts/migration_window_recovery.py scripts/render_start.py
      - name: Test PostgreSQL 17 and filesystem recovery
        run: python -m pytest -q tests/test_migration_window_recovery.py
