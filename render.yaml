services:
  - type: web
    name: carfast-v2
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/start.py
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: CarFast v2
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
