{% macro task_classification_fields(work_queues, work_departments, work_categories, work_subcategories, task=None, eligible_team_ids_by_category=None, eligible_user_ids_by_category=None) -%}
<fieldset class="task-create-hierarchy" data-work-hierarchy>
  <legend>Classificação operacional</legend>
  <label>Fila<select name="work_queue_id" required data-work-level="queue"><option value="">Selecionar fila</option>{% for item in work_queues %}<option value="{{ item.id }}" {% if task and task.work_queue_id == item.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label>
  <label>Departamento<select name="work_department_id" required data-work-level="department"><option value="">Selecionar departamento</option>{% for item in work_departments %}<option value="{{ item.id }}" data-parent="{{ item.queue_id }}" data-requires-description="{{ 'true' if item.requires_description else 'false' }}" {% if task and task.work_department_id == item.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label>
  <label>Categoria<select name="work_category_id" required data-work-level="category"><option value="">Selecionar categoria</option>{% for item in work_categories %}<option value="{{ item.id }}" data-parent="{{ item.department_id }}" data-requires-description="{{ 'true' if item.requires_description else 'false' }}"{% if eligible_team_ids_by_category is not none %} data-team-ids="{{ eligible_team_ids_by_category.get(item.id, [])|join(',') }}"{% endif %}{% if eligible_user_ids_by_category is not none %} data-user-ids="{{ eligible_user_ids_by_category.get(item.id, [])|join(',') }}"{% endif %} {% if task and task.work_category_id == item.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label>
  <label>Subcategoria<select name="work_subcategory_id" data-work-level="subcategory"><option value="">Sem subcategoria</option>{% for item in work_subcategories %}<option value="{{ item.id }}" data-parent="{{ item.category_id }}" data-requires-description="{{ 'true' if item.requires_description else 'false' }}" {% if task and task.work_subcategory_id == item.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label>
  <label class="span-2" data-work-other hidden>Descrição da classificação<input name="classification_other_text" maxlength="500" value="{{ task.classification_other_text if task and task.classification_other_text else '' }}" placeholder="Indica a classificação a rever"></label>
</fieldset>
{%- endmacro %}
