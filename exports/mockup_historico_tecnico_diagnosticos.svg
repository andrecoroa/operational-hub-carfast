  <text x="380" y="246" class="muted">Chassi</text>
  <text x="460" y="246" class="td">VR7EFYHT2PJ697244</text>
  <text x="720" y="246" class="muted">Último serviço</text>
  <text x="850" y="246" class="td">30.000 km</text>
  <text x="1040" y="246" class="muted">Próximo serviço</text>
  <text x="1180" y="246" class="td">40.000 km / 2026-08-26</text>

  <rect x="40" y="305" width="1520" height="82" rx="10" class="card"/>
  <text x="70" y="336" class="label">RELATÓRIOS</text>
  <rect x="70" y="350" width="246" height="42" rx="21" fill="#A64B39"/>
  <text x="96" y="377" font-family="Arial" font-size="15" font-weight="800" fill="white">Manutenção</text>
  <rect x="330" y="350" width="230" height="42" rx="21" class="card"/>
  <text x="356" y="377" class="bold">Lubrificação motor</text>
  <rect x="574" y="350" width="190" height="42" rx="21" class="card"/>
  <text x="600" y="377" class="bold">Telecarregamento</text>
  <rect x="778" y="350" width="170" height="42" rx="21" class="card"/>
  <text x="804" y="377" class="bold">Defeitos</text>
  <rect x="1180" y="334" width="340" height="42" rx="8" fill="#F7F9FC" stroke="#DDE3EA"/>
