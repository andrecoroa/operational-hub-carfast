services:
  - type: web
    name: operational-hub-carfast
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/render_start.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: Operational Hub Carfast
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: operational-hub-carfast-db
          property: connectionString
      - key: CARFAST_ONE_OFF_202605_ANDRE_TASKS_TO_CREATORS
        value: apply

databases:
  - name: operational-hub-carfast-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: carfast_v2
    user: carfast_app
