  <text x="990" y="580" class="th">20/04/2026 12:42</text>
  <text x="990" y="602" class="small">Pós-intervenção</text>
  <text x="1268" y="580" class="th">Variação</text>
  <line x1="70" y1="622" x2="1530" y2="622" class="line"/>

