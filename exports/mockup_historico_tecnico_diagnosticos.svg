  <line x1="70" y1="838" x2="1530" y2="838" class="line"/>

  <text x="84" y="870" class="td">Limite quilométrico ultrapassado</text>
  <text x="430" y="870" class="td">Não</text>
  <text x="710" y="870" class="td">Sim</text>
  <text x="990" y="870" class="td">Não</text>
  <rect x="1260" y="850" width="160" height="32" rx="16" class="warn"/>
