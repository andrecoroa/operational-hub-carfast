name: CI

on:
  pull_request:
  push:
    branches:
      - v2/production
      - integration/modular-architecture

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgresql+psycopg://carfast:carfast@localhost:5432/carfast_test
      DOCUMENT_ARCHIVE_ROOT: /tmp/carfast-documents
      DOCUMENT_INVOICE_INBOX_PATH: /tmp/carfast-documents/inbox
      EMAIL_INBOUND_ENABLED: "false"
      EMAIL_OUTBOUND_ENABLED: "false"
      EMAIL_STORAGE_ROOT: /tmp/carfast-email
      INTEGRATION_API_KEY: ""
      POSTMARK_SERVER_TOKEN: ""

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: carfast_test
          POSTGRES_USER: carfast
          POSTGRES_PASSWORD: carfast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carfast -d carfast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile and import application
        run: |
          python -m compileall -q app scripts
          python -c "from app.main import app; assert app.title"
          python -m ruff check scripts/check_migration_heads.py scripts/bootstrap_installation.py scripts/check_clean_install.py scripts/capture_architecture_baseline.py scripts/export_legacy_inventory.py scripts/build_integral_config_manifest.py scripts/build_integral_reconciliation_manifest.py scripts/compare_integral_reconciliation_manifests.py scripts/export_integral_storage.py scripts/hash_age_artifact.py scripts/import_integral_storage.py scripts/integral_private_transfer.py scripts/integral_render_contract.py scripts/integral_render_entrypoint.py scripts/preflight_integral_config.py scripts/preflight_integral_runtime.py scripts/rehearse_storage_preseed_delta.py scripts/reset_integral_target_sequences.py scripts/run_phase10_rehearsal.py scripts/standard_bundle_ack.py scripts/validate_isolated_environment.py app/platform app/partners app/documents app/service_desk app/stock_domain app/automotive app/models/platform.py app/core/return_context.py app/core/post_action.py migrations/versions/fff37f8a9b0d_add_module_catalogue.py tests/test_modular_foundation.py tests/test_visual_foundation.py tests/test_partners_boundary.py tests/test_documents_boundary.py tests/test_service_desk_boundary.py tests/test_stock_boundary.py tests/test_automotive_boundary.py tests/test_legacy_consolidation.py tests/test_phase10_rehearsal.py tests/test_integral_config.py tests/test_integral_reconciliation.py tests/test_integral_storage_stream.py tests/test_integral_transfer.py tests/test_integral_render_entrypoint.py tests/test_isolated_environment.py tests/test_preflight_integral_runtime.py tests/test_storage_preseed_delta.py

      - name: Verify frozen architecture baseline
        run: python -m scripts.capture_architecture_baseline --check

      - name: Validate Alembic graph
        run: python scripts/check_migration_heads.py

      - name: Apply migrations to isolated PostgreSQL
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade ffae1f2a3b4c
          python -m alembic upgrade head
          python -m alembic current --check-heads

      - name: Validate reusable clean installation
        run: |
          python -m scripts.bootstrap_installation
          python -m scripts.check_clean_install
          python -m scripts.run_phase10_rehearsal

      - name: Run tests
        run: >-
          python -m pytest -q
          tests/test_foundation_api.py
          tests/test_navigation_rbac.py
          tests/test_email_postmark.py
          tests/test_service_desk_operations.py
          tests/test_modular_foundation.py
          tests/test_visual_foundation.py
          tests/test_partners_boundary.py
          tests/test_documents_boundary.py
          tests/test_service_desk_boundary.py
          tests/test_stock_boundary.py
          tests/test_automotive_boundary.py
          tests/test_legacy_consolidation.py
          tests/test_phase10_rehearsal.py
          tests/test_integral_reconciliation.py
          tests/test_integral_storage_stream.py
          tests/test_integral_transfer.py
          tests/test_integral_render_entrypoint.py
          tests/test_isolated_environment.py
          tests/test_storage_preseed_delta.py

  storage-preseed-standard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python and standard transport dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y age openssh-server
      - name: Pin and start PostgreSQL 17
        run: |
          docker pull postgres:17-bookworm
          POSTGRES_DIGEST="$(docker image inspect postgres:17-bookworm --format '{{index .RepoDigests 0}}')"
          test -n "$POSTGRES_DIGEST"
          echo "CARFAST_POSTGRES_IMAGE=$POSTGRES_DIGEST" >> "$GITHUB_ENV"
          docker run -d --name carfast-standard-postgres --network host \
            -e POSTGRES_DB=carfast_test -e POSTGRES_USER=carfast \
            -e POSTGRES_PASSWORD=carfast "$POSTGRES_DIGEST"
          for attempt in $(seq 1 30); do
            docker exec carfast-standard-postgres pg_isready -U carfast -d carfast_test && break
            test "$attempt" -lt 30
            sleep 1
          done
      - name: Configure isolated loopback SSH
        run: |
          mkdir -p /dev/shm/carfast-ssh ~/.ssh
          sudo passwd -d "$USER"
          ssh-keygen -q -t ed25519 -N '' -f /dev/shm/carfast-ssh/client
          ssh-keygen -q -t ed25519 -N '' -f /dev/shm/carfast-ssh/host
          cat /dev/shm/carfast-ssh/client.pub > ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys /dev/shm/carfast-ssh/client
          printf 'Port 22222\nListenAddress 127.0.0.1\nHostKey /dev/shm/carfast-ssh/host\nUsePAM no\nPasswordAuthentication no\nKbdInteractiveAuthentication no\nPubkeyAuthentication yes\nAuthorizedKeysFile .ssh/authorized_keys\nAllowUsers %s\nPidFile /dev/shm/carfast-ssh/sshd.pid\n' "$USER" > /dev/shm/carfast-ssh/sshd_config
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f /dev/shm/carfast-ssh/sshd_config
          ssh-keyscan -p 22222 127.0.0.1 > /dev/shm/carfast-ssh/known_hosts 2>/dev/null
      - name: Run 3/3 full-scale standard rehearsals
        env:
          CARFAST_KNOWN_HOSTS: /dev/shm/carfast-ssh/known_hosts
          CARFAST_SSH_IDENTITY: /dev/shm/carfast-ssh/client
        run: bash scripts/run_storage_preseed_delta_standard_rehearsal.sh
      - name: Prove tmpfs cleanup
        if: always()
        run: |
          test -z "$(find /dev/shm -maxdepth 1 -type d -name 'carfast-standard-*' -print -quit)"
          rm -rf /dev/shm/carfast-ssh ~/.ssh/authorized_keys
          docker rm -f carfast-standard-postgres >/dev/null 2>&1 || true
