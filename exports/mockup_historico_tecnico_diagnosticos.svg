  <line x1="70" y1="730" x2="1530" y2="730" class="line"/>

  <text x="84" y="762" class="td">Dias até próxima manutenção</text>
  <text x="430" y="762" class="td">476 dias</text>
  <text x="710" y="762" class="td">188 dias</text>
  <text x="990" y="762" class="td">730 dias</text>
  <rect x="1260" y="742" width="170" height="32" rx="16" class="ok"/>
  <text x="1280" y="763" class="td">Novo ciclo iniciado</text>
  <line x1="70" y1="784" x2="1530" y2="784" class="line"/>

